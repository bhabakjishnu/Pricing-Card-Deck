<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradBasic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4F4" />
      <stop offset="100%" stop-color="#FFD6E0" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#BDB2FF" />
    </linearGradient>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="320" height="180" rx="12" fill="url(#bgGradBasic)" />
  <rect width="318" height="178" x="1" y="1" rx="11" stroke="#BDB2FF" stroke-width="1.5" />

  <!-- Code Grid Pattern Backdrop -->
  <g opacity="0.4" stroke="#BDB2FF" stroke-width="1">
    <line x1="20" y1="30" x2="300" y2="30" />
    <line x1="20" y1="60" x2="300" y2="60" />
    <line x1="20" y1="90" x2="300" y2="90" />
    <line x1="20" y1="120" x2="300" y2="120" />
    <line x1="20" y1="150" x2="300" y2="150" />
  </g>

  <!-- Floating Editor Window -->
  <rect x="55" y="32" width="210" height="116" rx="8" fill="#FFFFFF" stroke="#BDB2FF" stroke-width="1.5" />
  <!-- Window Controls -->
  <circle cx="70" cy="45" r="4" fill="#FFB3C6" />
  <circle cx="82" cy="45" r="4" fill="#BDB2FF" />
  <circle cx="94" cy="45" r="4" fill="#3A86FF" />
  
  <!-- Terminal Prompt / Code Brackets -->
  <path d="M90 76 L115 95 L90 114" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="128" y1="114" x2="150" y2="114" stroke="#3A86FF" stroke-width="4" stroke-linecap="round" />

  <!-- Code syntax lines -->
  <rect x="165" y="70" width="80" height="8" rx="4" fill="#3A86FF" fill-opacity="0.8" />
  <rect x="165" y="85" width="55" height="8" rx="4" fill="#BDB2FF" />
  <rect x="165" y="100" width="70" height="8" rx="4" fill="#FFD6E0" />

  <!-- Tier Badge Marker -->
  <g transform="translate(225, 20)">
    <rect width="65" height="22" rx="11" fill="#FFFFFF" stroke="#3A86FF" stroke-width="1.5"/>
    <text x="32" y="15" fill="#3A86FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STATIC</text>
  </g>
</svg>
