<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradBasic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glowBasic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="320" height="180" rx="12" fill="url(#bgGradBasic)" />
  <rect width="318" height="178" x="1" y="1" rx="11" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Code Grid Pattern Backdrop -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="20" y1="30" x2="300" y2="30" />
    <line x1="20" y1="60" x2="300" y2="60" />
    <line x1="20" y1="90" x2="300" y2="90" />
    <line x1="20" y1="120" x2="300" y2="120" />
    <line x1="20" y1="150" x2="300" y2="150" />
  </g>

  <!-- Floating Editor Window -->
  <rect x="55" y="32" width="210" height="116" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <!-- Window Controls -->
  <circle cx="70" cy="45" r="4" fill="#ef4444" />
  <circle cx="82" cy="45" r="4" fill="#f59e0b" />
  <circle cx="94" cy="45" r="4" fill="#10b981" />
  
  <!-- Terminal Prompt / Code Brackets -->
  <path d="M90 76 L115 95 L90 114" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBasic)" />
  <line x1="128" y1="114" x2="150" y2="114" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Code syntax lines -->
  <rect x="165" y="70" width="80" height="8" rx="4" fill="#38bdf8" fill-opacity="0.7" />
  <rect x="165" y="85" width="55" height="8" rx="4" fill="#94a3b8" fill-opacity="0.5" />
  <rect x="165" y="100" width="70" height="8" rx="4" fill="#38bdf8" fill-opacity="0.4" />

  <!-- Tier Badge Marker -->
  <g transform="translate(225, 20)">
    <rect width="65" height="22" rx="11" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STATIC</text>
  </g>
</svg>
