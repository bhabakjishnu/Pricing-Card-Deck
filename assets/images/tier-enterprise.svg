<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradEnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4F4" />
      <stop offset="100%" stop-color="#FFD6E0" />
    </linearGradient>
    <linearGradient id="blueLavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#BDB2FF" />
    </linearGradient>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="320" height="180" rx="12" fill="url(#bgGradEnt)" />
  <rect width="318" height="178" x="1" y="1" rx="11" stroke="#BDB2FF" stroke-width="1.5" />

  <!-- Global Orbital Rings -->
  <ellipse cx="160" cy="90" rx="110" ry="45" stroke="#BDB2FF" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-15 160 90)" />
  <ellipse cx="160" cy="90" rx="90" ry="35" stroke="#3A86FF" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(25 160 90)" />

  <!-- Central Cloud Infrastructure Core -->
  <circle cx="160" cy="90" r="42" fill="#FFFFFF" stroke="url(#blueLavenderGrad)" stroke-width="2.5" />
  
  <!-- Server / Shield Nodes -->
  <path d="M160 68 L178 78 V98 L160 108 L142 98 V78 Z" fill="#FFF4F4" stroke="#3A86FF" stroke-width="2" />
  <circle cx="160" cy="88" r="6" fill="#3A86FF" />

  <!-- Satellite Nodes -->
  <!-- Node 1: Left Cloud -->
  <circle cx="75" cy="75" r="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="1.5" />
  <line x1="89" y1="78" x2="142" y2="85" stroke="#BDB2FF" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M70 76 a4 4 0 0 1 7 -2 a5 5 0 0 1 8 3 a3 3 0 0 1 -1 5 h-14 z" fill="#3A86FF" />

  <!-- Node 2: Right Database Cluster -->
  <circle cx="245" cy="105" r="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="1.5" />
  <line x1="231" y1="102" x2="178" y2="95" stroke="#BDB2FF" stroke-width="1.5" stroke-dasharray="3 3" />
  <!-- Database Disks -->
  <ellipse cx="245" cy="100" rx="6" ry="2" fill="#3A86FF" />
  <ellipse cx="245" cy="105" rx="6" ry="2" fill="#BDB2FF" />
  <ellipse cx="245" cy="110" rx="6" ry="2" fill="#FFB3C6" />

  <!-- Node 3: Top CI/CD Deployment -->
  <circle cx="160" cy="30" r="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="1.5" />
  <line x1="160" y1="42" x2="160" y2="68" stroke="#3A86FF" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M156 30 L160 26 L164 30 M160 26 V34" stroke="#3A86FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High Availability Pill -->
  <g transform="translate(195, 20)">
    <rect width="90" height="22" rx="11" fill="#FFFFFF" stroke="#3A86FF" stroke-width="1.5"/>
    <text x="45" y="15" fill="#3A86FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">99.99% SLA</text>
  </g>
</svg>
