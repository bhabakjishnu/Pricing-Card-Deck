<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="320" height="180" rx="12" fill="url(#bgGradPro)" />
  <rect width="318" height="178" x="1" y="1" rx="11" stroke="url(#proGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Isometric Architecture Layers -->
  <!-- Layer 3 (Bottom) -->
  <polygon points="160,145 250,110 160,85 70,110" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <!-- Connecting Vertical Light Pillars -->
  <line x1="70" y1="110" x2="70" y2="85" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  <line x1="250" y1="110" x2="250" y2="85" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Layer 2 (Middle - Reactive Components) -->
  <polygon points="160,120 250,85 160,60 70,85" fill="#0f172a" stroke="#4f46e5" stroke-width="2" opacity="0.95" />

  <!-- Layer 1 (Top - Lightning Fast Execution) -->
  <polygon points="160,95 240,65 160,42 80,65" fill="#1e1b4b" fill-opacity="0.5" stroke="#818cf8" stroke-width="1.5" />

  <!-- Dynamic Lightning Bolt Symbol -->
  <path d="M165 30 L140 78 L158 78 L148 115 L182 66 L164 66 Z" fill="url(#boltGrad)" />

  <!-- Floating Feature Particles -->
  <circle cx="100" cy="48" r="3" fill="#60a5fa" />
  <circle cx="225" cy="50" r="3" fill="#a855f7" />
  <circle cx="210" cy="125" r="3.5" fill="#6366f1" />
  <circle cx="105" cy="128" r="3" fill="#818cf8" />
</svg>
