<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4F4" />
      <stop offset="100%" stop-color="#FFD6E0" />
    </linearGradient>
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#BDB2FF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#BDB2FF" />
    </linearGradient>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="320" height="180" rx="12" fill="url(#bgGradPro)" />
  <rect width="318" height="178" x="1" y="1" rx="11" stroke="#3A86FF" stroke-width="1.5" />

  <!-- Isometric Architecture Layers -->
  <!-- Layer 3 (Bottom) -->
  <polygon points="160,145 250,110 160,85 70,110" fill="#FFFFFF" stroke="#BDB2FF" stroke-width="2" />
  <!-- Connecting Vertical Pillars -->
  <line x1="70" y1="110" x2="70" y2="85" stroke="#3A86FF" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="250" y1="110" x2="250" y2="85" stroke="#3A86FF" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Layer 2 (Middle - Reactive Components) -->
  <polygon points="160,120 250,85 160,60 70,85" fill="#FFF4F4" stroke="#3A86FF" stroke-width="2" />

  <!-- Layer 1 (Top - Lightning Fast Execution) -->
  <polygon points="160,95 240,65 160,42 80,65" fill="#FFFFFF" stroke="#BDB2FF" stroke-width="1.5" />

  <!-- Dynamic Lightning Bolt Symbol -->
  <path d="M165 30 L140 78 L158 78 L148 115 L182 66 L164 66 Z" fill="url(#boltGrad)" />

  <!-- Floating Feature Particles -->
  <circle cx="100" cy="48" r="3.5" fill="#3A86FF" />
  <circle cx="225" cy="50" r="3" fill="#BDB2FF" />
  <circle cx="210" cy="125" r="3.5" fill="#3A86FF" />
  <circle cx="105" cy="128" r="3" fill="#FFB3C6" />
</svg>
