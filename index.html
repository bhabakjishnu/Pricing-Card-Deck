<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Knewave&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <a href="#">DevLogo</a>
        </div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="auth-actions">
            <a href="#" class="btn btn--login">Log In</a>
            <a href="#" class="btn btn--signup">Sign Up</a>
        </div>
    </header>
    <main class="main-content">
        <article class="card">
            <header class="card__header">
                <img src="assets/images/Profile-picture.jpg" alt="Developer avatar" class="avatar">
                <h2 class="card__title">Developer</h2>
            </header>
            <figure class="card__body">
                <img src="assets/images/Profile-picture.jpg" alt="Project preview" class="feature-img">
                <figcaption class="card__desc">
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Vero numquam nam odit incidunt id. Ipsam inventore illo quisquam perferendis veniam modi exercitat.
                </figcaption>
            </figure>
            <footer class="card__footer">
                <button class="icon-btn btn-like" aria-label="Like this profile">
                    <i class="fa-solid fa-heart"></i>
                </button>
                <button class="icon-btn btn-share" aria-label="Share this profile">
                    <i class="fa-solid fa-share"></i>
                </button>
            </footer>
        </article>
    </main>
    <!-- Added Site Footer -->
    <footer class="site-footer">
        <div class="footer__container">
            <div class="footer__brand">
                <h3>DevLogo</h3>
                <p>Crafting digital experiences with modern web technologies.</p>
            </div>
            <div class="footer__social">
                <h4>Connect</h4>
                <ul class="social-list">
                    <!-- Using aria-label for accessibility on icon-only links -->
                    <li><a href="#" aria-label="Visit our GitHub"><i class="fa-brands fa-github"></i></a></li>
                    <li><a href="#" aria-label="Visit our LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>
                    <li><a href="#" aria-label="Visit our Twitter"><i class="fa-brands fa-twitter"></i></a></li>
                </ul>
            </div>
        </div>
        <div class="footer__copyright">
            <p>&copy; 2026 DevLogo. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
